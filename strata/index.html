<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Strata | Construction Intelligence</title><style>
:root{--bg:#f6f7f5;--ink:#17251f;--muted:#78847e;--line:#e5e9e5;--green:#184e3c;--light:#e5f0e8;--orange:#b36a31}*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.shell{display:flex;min-height:100vh}.sidebar{width:242px;background:#11271f;color:#c4d2ca;padding:25px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:26px;color:white;font-weight:750;letter-spacing:-1.3px;padding:0 12px 25px}.brand span{color:#92bd9d}.work{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#799588;padding:18px 13px 10px}.navbtn{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#b4c5ba;padding:12px 14px;border-radius:9px;width:100%;text-align:left;margin:2px 0}.navbtn:hover,.navbtn.active{background:#264537;color:white}.navbtn .ico{font-size:18px;width:22px}.sidefoot{margin-top:auto;border-top:1px solid #355044;padding:18px 12px;font-size:12px;color:#a6bbaf}.main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:15px}.org{font-weight:650}.org small{display:block;color:var(--muted);font-weight:400}.avatar{width:34px;height:34px;background:#dbe9df;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#24523c}.content{max-width:1350px;margin:auto;padding:34px 38px 80px}.eyebrow{color:#5f776a;font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.heading h1{font-size:clamp(28px,3vw,38px);letter-spacing:-.045em;line-height:1.2;margin:7px 0}.sub{color:#7b8981;margin:0}.btn{background:var(--green);border:1px solid var(--green);color:white;padding:11px 16px;border-radius:9px;font-weight:650}.btn.alt{background:white;color:#244735;border-color:#d7e0da}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;min-width:0}.metric .label{font-size:12px;color:#7a8980}.metric .value{font-size:29px;letter-spacing:-.05em;font-weight:750;margin:10px 0 3px}.metric .delta{font-size:12px;color:#5c7767}.panel{margin-top:24px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.panelhead h2{font-size:18px;letter-spacing:-.025em;margin:0}.twocol{display:grid;grid-template-columns:1.65fr 1fr;gap:20px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:560px}th{font-size:11px;color:#829188;text-transform:uppercase;letter-spacing:.08em;font-weight:650}th,td{padding:16px 10px;border-bottom:1px solid #edf0ed}td{font-size:13px}tr:last-child td{border:0}.projectname{font-weight:650}.small{font-size:12px;color:#849087}.pill{display:inline-block;padding:4px 9px;border-radius:50px;background:#e7f1e9;color:#326349;font-size:11px;font-weight:700}.pill.warn{background:#fff0df;color:#9b5b22}.pill.gray{background:#eef0ee;color:#647269}.listrow{padding:14px 0;border-bottom:1px solid #edf0ed;display:flex;gap:12px;align-items:flex-start}.listrow:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:#c98543;margin-top:7px;flex-shrink:0}.dot.green{background:#69a27b}.hero{padding:30px;border-radius:14px;background:linear-gradient(115deg,#1c4a38,#2d6950);color:white;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:25px}.hero h2{font-size:26px;line-height:1.25;letter-spacing:-.035em;margin:7px 0}.hero p{color:#c3dccb;max-width:610px}.hero .btn{background:#fff;color:#24513d;border-color:#fff}.skillgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.skill{display:flex;flex-direction:column;gap:11px}.skillicon{height:40px;width:40px;border-radius:10px;background:#e7f1e9;display:grid;place-items:center;font-size:20px}.skill h3{font-size:16px;margin:0}.skill p{color:#7c8981;margin:0;flex:1}.skillfooter{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab{padding:9px 14px;border:1px solid #dce4de;background:white;border-radius:40px;color:#587064}.tab.active{background:#1e513e;color:white;border-color:#1e513e}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:block;font-size:12px;color:#67776d;font-weight:650;margin-bottom:7px}select,input{padding:12px;border:1px solid #d9e2dc;border-radius:9px;background:#fff;width:100%;color:#203a2c}.review{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}.finding{padding:18px;border:1px solid #e6eae5;border-radius:10px;margin:10px 0;background:#fff}.finding h3{margin:0 0 7px;font-size:14px}.finding p{color:#6d7e73;margin:0 0 10px}.bar{height:8px;border-radius:20px;background:#e6ece7;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#69987a}.muted{color:#718076}.empty{border:1px dashed #cbd8ce;border-radius:12px;padding:24px;color:#78887c}.notice{background:#f0f5ef;border:1px solid #dce8df;padding:14px 18px;border-radius:10px;color:#43624e;font-size:12px;margin-bottom:22px}.toast{position:fixed;bottom:24px;right:24px;background:#163e2e;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 12px 30px #0002;display:none;z-index:10}.hidden{display:none!important}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.skillgrid{grid-template-columns:repeat(2,1fr)}.twocol,.review{grid-template-columns:1fr}}@media(max-width:750px){.shell{display:block}.sidebar{position:relative;height:auto;width:100%;padding:12px;display:block}.brand{padding:5px 8px;font-size:22px}.work,.sidefoot{display:none}.sidebar nav{display:flex;overflow:auto}.navbtn{white-space:nowrap;width:auto;padding:8px 10px}.navbtn .ico{display:none}.topbar{height:64px;padding:0 18px}.content{padding:25px 16px}.grid,.skillgrid,.formrow{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.hero{flex-direction:column;align-items:start}.card{padding:18px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">strata<span>.</span></div><div class="work">Workspace</div><nav id="nav"></nav><div class="sidefoot">◉ Demo workspace<br><span style="color:#759889">Synthetic data · No live integrations</span></div></aside><div class="main"><header class="topbar"><div class="org">Meridian Construction Group <small>Enterprise workspace · Demonstration</small></div><div style="display:flex;align-items:center;gap:14px"><span class="pill">Demo environment</span><div class="avatar">MC</div></div></header><main class="content" id="view"></main></div></div><div class="toast" id="toast"></div><script>
const projects=[{name:'Westbridge Residences',type:'Multifamily',id:'MC-2401',budget:42800000,margin:8.4,risk:'Elevated',progress:64},{name:'Harbor Point Hotel',type:'Hospitality',id:'MC-2402',budget:26750000,margin:11.2,risk:'On track',progress:41},{name:'Park Avenue Renovation',type:'Renovation',id:'MC-2403',budget:18500000,margin:6.9,risk:'Elevated',progress:82},{name:'Hudson Office Fit-Out',type:'Commercial',id:'MC-2404',budget:12400000,margin:12.6,risk:'On track',progress:29}];
const skills=[{name:'Estimate Risk Review',cat:'Estimating',icon:'⌕',desc:'Cross-check estimates against scope, qualifications, and historical projects.',tools:'Drawings · Estimates · Cost library'},{name:'Historical Cost Intelligence',cat:'Estimating',icon:'◷',desc:'Find comparable projects and explain cost and productivity differences.',tools:'ERP · Cost codes · Project history'},{name:'Scope Gap Detection',cat:'Estimating',icon:'▤',desc:'Spot specification requirements missing from bid coverage.',tools:'Specifications · Sub bids'},{name:'Invoice Reconciliation',cat:'Accounting',icon:'▣',desc:'Match invoices to commitments and flag coding or approval exceptions.',tools:'ERP · Purchase orders'},{name:'WIP Analyst',cat:'Accounting',icon:'◫',desc:'Investigate changes in forecast-to-complete and reported margins.',tools:'Job cost · WIP reports'},{name:'Margin Risk Monitor',cat:'Project controls',icon:'◉',desc:'Surface cost trends and unresolved changes before they become surprises.',tools:'Budgets · Change events'},{name:'Change Order Review',cat:'Project controls',icon:'⇄',desc:'Review change-order completeness and supporting evidence.',tools:'RFIs · Change events · Contracts'},{name:'Contract Obligation Check',cat:'Contracts',icon:'♧',desc:'Connect contractual obligations to scope and estimate assumptions.',tools:'Contracts · Specifications'},{name:'Bid Leveling Assistant',cat:'Procurement',icon:'☷',desc:'Normalize subcontractor proposals and expose exclusions.',tools:'Subcontractor bids · Bid tabs'}];
let state={page:'overview',category:'All',enabled:new Set(['Estimate Risk Review','Historical Cost Intelligence','Margin Risk Monitor']),review:false,project:0,activity:[],approved:new Set()};
const fmt=n=>'$'+(n/1000000).toFixed(1)+'M';
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>e.style.display='none',3000)}
function go(p){state.page=p;render();window.scrollTo(0,0)}
function heading(k,t,s,button=''){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="sub">'+s+'</p></div>'+button+'</div>'}
function card(t,b){return '<div class="card"><h3>'+t+'</h3>'+b+'</div>'}
function projectTable(){return '<div class="card tablewrap"><table><thead><tr><th>Project</th><th>Contract value</th><th>Forecast margin</th><th>Completion</th><th>Status</th></tr></thead><tbody>'+projects.map((p,i)=>'<tr style="cursor:pointer" onclick="state.project='+i+';go(\'projects\')"><td><div class="projectname">'+p.name+'</div><div class="small">'+p.id+' · '+p.type+'</div></td><td>'+fmt(p.budget)+'</td><td>'+p.margin.toFixed(1)+'%</td><td>'+p.progress+'%</td><td><span class="pill '+(p.risk==='Elevated'?'warn':'')+'">'+p.risk+'</span></td></tr>').join('')+'</tbody></table></div>'}
function overview(){return heading('Command center','Good morning, Alex.','Your construction operations at a glance. All figures are illustrative.','<button class="btn" onclick="go(\'review\')">Run estimate review ↗</button>')+'<div class="notice">Prototype environment. Project names, costs, findings, and performance metrics are synthetic. No financial or estimating systems are connected.</div><div class="grid">'+[['Active project value','$100.5M','4 active projects'],['Forecast gross margin','9.2%','Illustrative portfolio estimate'],['Items to review','7','Sample risk signals'],['Enabled AI skills',state.enabled.size,'Across 5 specialties']].map(x=>'<div class="card metric"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="delta">'+x[2]+'</div></div>').join('')+'</div><div class="panel hero"><div><div class="eyebrow" style="color:#b7d8c3">AI WORKSPACE</div><h2>Every project deserves a second set of eyes.</h2><p>Run repeatable, evidence-based reviews with specialized construction skills. Keep the final decision with your team.</p></div><button class="btn" onclick="go(\'review\')">Open estimate reviewer →</button></div><div class="twocol"><section><div class="panelhead"><h2>Project portfolio</h2><button class="btn alt" onclick="go(\'projects\')">View projects</button></div>'+projectTable()+'</section><section><div class="panelhead"><h2>Attention needed</h2></div><div class="card">'+[['Westbridge Residences','Review potential temporary protection scope gap'],['Park Avenue Renovation','Unresolved change exposure needs confirmation'],['Harbor Point Hotel','Subcontractor exclusions pending review']].map((x,i)=>'<div class="listrow"><span class="dot '+(i===2?'green':'')+'"></span><div><strong>'+x[0]+'</strong><div class="small">'+x[1]+'</div></div></div>').join('')+'<p class="small" style="margin-top:15px">Sample alerts, not actual project findings.</p></div></section></div>'}
function review(){let p=projects[state.project];return heading('Estimating intelligence','Estimate risk review','A guided quality check before a bid is submitted.')+'<div class="review"><div class="card"><div class="eyebrow">Review setup</div><h2 style="font-size:23px;margin:12px 0">Choose a project</h2><label class="field" for="project">Project</label><select id="project" onchange="state.project=Number(this.value);state.review=false;render()">'+projects.map((x,i)=>'<option value="'+i+'" '+(i===state.project?'selected':'')+'>'+x.name+'</option>').join('')+'</select><div style="margin-top:20px"><label class="field">Review package</label><div class="empty">▤ &nbsp; Sample estimate workbook<br>▤ &nbsp; Sample specifications<br>▤ &nbsp; Sample subcontractor bid tab<p class="small" style="margin:10px 0 0">Synthetic demonstration package. File upload and live document analysis are not implemented.</p></div></div><div style="margin-top:20px"><label class="field">Skills used</label><span class="pill">Estimate Risk Review</span> <span class="pill">Scope Gap Detection</span> <span class="pill">Historical Costs</span></div><button class="btn" style="width:100%;margin-top:24px" onclick="state.review=true;state.activity.unshift('Demo estimate review run · '+p.name);render()">Run simulated review →</button></div><div class="card"><div class="eyebrow">Review results</div>'+(!state.review?'<div style="padding:60px 12px;text-align:center"><div style="font-size:42px;color:#8aa996">⌕</div><h2 style="font-size:22px">Ready when you are</h2><p class="muted">Select a project and run the sample review to explore the experience.</p></div>':'<div style="margin:15px 0"><span class="pill warn">3 illustrative findings</span> <span class="pill">Human review required</span></div>'+[['High','Temporary protection scope may be missing','Specification section references protection requirements, but the example estimate contains no matching line.','Spec 01 56 00 · Estimate cost code 01-500'],['Medium','Drywall unit rate merits a second look','The example unit rate differs from the synthetic historical comparison range.','Estimate 09-200 · Comparable projects'],['Medium','Subcontractor exclusion needs confirmation','A sample subcontractor proposal excludes disposal that appears in the owner scope.','Bid qualification 4 · Scope section 02']].map((x,i)=>'<div class="finding"><div class="small">'+x[0]+' priority · Finding '+(i+1)+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p><div class="small">Evidence: '+x[3]+'</div><button class="btn alt" style="margin-top:10px;font-size:12px" onclick="state.approved.add('+i+');toast(\'Marked for estimator follow-up\')">Mark for follow-up</button></div>').join('')+'<div class="notice">These findings are prewritten examples, not results of AI inference. A production system would provide verifiable citations to actual source documents.</div>')+'</div></div>'}
function marketplace(){let cats=['All','Estimating','Accounting','Project controls','Contracts','Procurement'];return heading('Capabilities','Skills marketplace','Give every team a specialist, without replacing the tools they already use.')+'<div class="tabs">'+cats.map(c=>'<button class="tab '+(state.category===c?'active':'')+'" onclick="state.category=\''+c+'\';render()">'+c+'</button>').join('')+'</div><div class="skillgrid">'+skills.filter(s=>state.category==='All'||s.cat===state.category).map(s=>'<div class="card skill"><div class="skillicon">'+s.icon+'</div><div class="small">'+s.cat+'</div><h3>'+s.name+'</h3><p>'+s.desc+'</p><div class="small">Inputs: '+s.tools+'</div><div class="skillfooter"><span class="pill '+(state.enabled.has(s.name)?'':'gray')+'">'+(state.enabled.has(s.name)?'Enabled':'Available')+'</span><button class="btn alt" onclick="toggleSkill(\''+s.name+'\')">'+(state.enabled.has(s.name)?'Disable':'Enable')+'</button></div></div>').join('')+'</div><p class="small" style="margin-top:20px">Skill toggles are local to this browser session. Production skills require access controls, versioning, validation, and administrator approval.</p>'}
function toggleSkill(n){state.enabled.has(n)?state.enabled.delete(n):state.enabled.add(n);toast(n+(state.enabled.has(n)?' enabled':' disabled'));render()}
function projectsPage(){let p=projects[state.project];return heading('Portfolio','Projects','Explore project context, costs and AI review entry points.')+projectTable()+'<div class="panel twocol"><div class="card"><div class="eyebrow">Selected project</div><h2 style="font-size:25px">'+p.name+'</h2><p class="muted">'+p.type+' · '+p.id+'</p><div class="grid" style="grid-template-columns:repeat(2,1fr);margin:20px 0"><div><div class="small">Contract value</div><h2>'+fmt(p.budget)+'</h2></div><div><div class="small">Forecast margin</div><h2>'+p.margin+'%</h2></div></div><div class="small">Construction progress · '+p.progress+'%</div><div class="bar"><span style="width:'+p.progress+'%"></span></div><button class="btn" style="margin-top:24px" onclick="state.review=false;go(\'review\')">Review estimate →</button></div><div class="card"><h3>Connected evidence</h3><p class="muted">In production, this panel would show permissioned drawings, bid packages, ERP job-cost records and change orders.</p><div class="empty">No live sources connected in demo</div></div></div>'}
function finance(){return heading('Financial intelligence','Know where margin is moving.','A cross-system view of budget, commitments, actual costs and projected completion.')+'<div class="notice">All financial figures are illustrative and not calculated from accounting records.</div><div class="grid">'+[['Portfolio value','$100.5M'],['Example forecast margin','9.2%'],['Open change exposure','$1.24M'],['Exceptions to review','12']].map(x=>'<div class="card metric"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('')+'</div><div class="panel twocol"><div class="card"><h3>Margin by project</h3>'+projects.map(p=>'<div style="margin-top:20px"><div style="display:flex;justify-content:space-between"><strong>'+p.name+'</strong><span>'+p.margin+'%</span></div><div class="bar"><span style="width:'+(p.margin/15*100)+'%"></span></div></div>').join('')+'</div><div class="card"><h3>What the agent would investigate</h3>'+['Unapproved changes not reflected in forecast','Commitment values differing from budget','Invoices coded outside expected cost codes','Actual costs diverging from estimate assumptions'].map(x=>'<div class="listrow"><span class="dot"></span><div>'+x+'</div></div>').join('')+'<p class="small" style="margin-top:20px">Real reconciliation requires an authorized ERP integration and deterministic calculations.</p></div></div>'}
function integrations(){return heading('Infrastructure','Connect the tools you already use.','Keep existing systems of record. Bring intelligence across them.')+'<div class="notice">No connections have been authorized or established. The following are illustrative integration targets, not promises of supported connectors.</div><div class="skillgrid">'+[['Procore','Project management, budgets and change events'],['Sage / CMiC','ERP, commitments, invoices and job costs'],['Autodesk','Drawings, models and quantities'],['Microsoft 365','SharePoint, Excel and documents'],['DESTINI / STACK','Estimates, bid comparisons and cost libraries'],['Custom API / SFTP','Company-specific systems and exports']].map(x=>'<div class="card"><div class="skillicon">⇄</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p><span class="pill gray">Not connected</span><div style="margin-top:15px"><button class="btn alt" onclick="toast(\'Integration setup is not available in this prototype\')">Explore connection</button></div></div>').join('')+'</div>'}
function activity(){return heading('Governance','Activity & approvals','Make every agent action traceable and keep people in control.')+'<div class="card"><h3>Session activity</h3>'+(state.activity.length?state.activity.map(x=>'<div class="listrow"><span class="dot green"></span>'+x+'<span class="small">This session</span></div>').join(''):'<div class="empty">No simulated reviews have been run yet.</div>')+'<p class="small">This demo does not persist logs or record real approvals. Production would require immutable audit trails, identity, role permissions and retention policies.</p></div>'}
const pages=[['overview','▦','Overview'],['projects','▤','Projects'],['review','⌕','Estimate reviewer'],['finance','◫','Financial intelligence'],['marketplace','✧','Skills marketplace'],['integrations','⇄','Integrations'],['activity','◷','Activity & governance']];
function render(){document.getElementById('nav').innerHTML=pages.map(p=>'<button class="navbtn '+(state.page===p[0]?'active':'')+'" onclick="go(\''+p[0]+'\')"><span class="ico">'+p[1]+'</span>'+p[2]+'</button>').join('');document.getElementById('view').innerHTML=({overview,projects:projectsPage,review,finance,marketplace,integrations,activity})[state.page]()}
render();
</script></body></html>
