name: Process Change Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-pr:
    if: github.event.label.name == 'change-request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract request details
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body);
            core.setOutput('number', issue.number);
            core.setOutput('author', issue.user.login);

      - name: Create branch
        run: |
          git checkout -b change-request/${{ steps.request.outputs.number }}

      - name: Generate changes with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are modifying the personal website at natemitchcook.com.
            The site is a single index.html file with inline CSS.

            A visitor has requested the following change:

            ---
            ${{ steps.request.outputs.body }}
            ---

            Rules:
            - Only modify index.html (or add new static files if truly needed)
            - Maintain the existing design aesthetic (clean, minimal, system fonts)
            - Do not add external dependencies or scripts
            - Do not remove existing content unless explicitly asked
            - Keep changes minimal and focused on the request

            Make the requested change now.

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes generated"
            exit 0
          fi
          git add -A
          git commit -m "feat: change request #${{ steps.request.outputs.number }}"
          git push origin change-request/${{ steps.request.outputs.number }}

      - name: Create Pull Request
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Change Request #${{ steps.request.outputs.number }}`,
              body: `## Change Request\n\nFrom issue #${{ steps.request.outputs.number }} by @${{ steps.request.outputs.author }}\n\n### Original Request\n\n${{ steps.request.outputs.body }}\n\n---\n*This PR was auto-generated by an AI agent. Manual review and approval required before merge.*`,
              head: `change-request/${{ steps.request.outputs.number }}`,
              base: 'main'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.request.outputs.number }},
              body: `PR generated: ${pr.html_url}\n\nThis will be reviewed and merged manually.`
            });
