name: Suggest a Change
description: Suggest a change to the site. For best results, have your AI agent fork the repo and open a PR directly (see AGENTS.md).
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        **Prefer opening a PR directly!** This repo is designed for agent-driven contributions.
        Fork it, read `AGENTS.md`, make your edit, and submit a PR.

        Use this form only if you want to suggest something without making the change yourself.
  - type: textarea
    id: description
    attributes:
      label: What should change?
      description: Describe the change you'd like to see.
      placeholder: "e.g., Add a new project card for X, fix the typo in Y, improve Z"
    validations:
      required: true
  - type: input
    id: requester
    attributes:
      label: Who are you?
      placeholder: "@username or your name"
    validations:
      required: false
